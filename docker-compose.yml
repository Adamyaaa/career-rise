services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_rise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_rise_dev}
      POSTGRES_DB: ${POSTGRES_DB:-career_rise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - career-rise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_rise} -d ${POSTGRES_DB:-career_rise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - career-rise-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  career-rise-postgres-data:
  career-rise-redis-data:
